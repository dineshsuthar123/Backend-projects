server:
  port: 8081
  compression:
    enabled: true

spring:
  application:
    name: high-performance-url-shortener
  datasource:
    url: jdbc:postgresql://127.0.0.1:15432/url_shortener
    username: url_shortener
    password: url_shortener
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 500
      validation-timeout: 300
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      timeout: 200ms
      lettuce:
        pool:
          max-active: 64
          max-idle: 16
          min-idle: 4
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: 127.0.0.1:19092
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 50
        delivery.timeout.ms: 1000
        linger.ms: 5
    consumer:
      group-id: url-shortener-analytics
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.naresh.urlshortener.service
    listener:
      type: batch

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        url.redirect.latency: true
      percentiles:
        url.redirect.latency: 0.5,0.95,0.99
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request-id}] %logger{36} - %msg%n"

app:
  datasource:
    replica-urls: []
  base-url: http://localhost:8081
  code-length: 8
  cache-prefix: "url:"
  cache:
    stampede-lock-ttl: 5s
    stampede-poll-delay: 80ms
    stampede-max-wait: 400ms
  rate-limit:
    enabled: true
    requests: 120
    window: 1m
  analytics:
    queue-capacity: 10000
    batch-size: 500
    flush-delay: 2000
    hash-salt: ${ANALYTICS_HASH_SALT:dev-only-change-me}
    durable-enabled: true
    topic: url-redirect-events
