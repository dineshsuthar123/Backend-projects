<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="680" viewBox="0 0 1160 680" role="img" aria-labelledby="title desc">
  <title id="title">High-performance URL shortener architecture</title>
  <desc id="desc">Client and frontend call a Spring Boot API. The API uses Redis for cache, rate limiting, and stampede locks, PostgreSQL for URL mappings and partitioned analytics, Redpanda for durable analytics events, and Prometheus and Grafana for observability.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#166534"/>
    </marker>
    <style>
      .bg { fill: #f7fbf8; }
      .box { fill: #ffffff; stroke: #b7d4bf; stroke-width: 2; rx: 10; }
      .core { fill: #ecfdf3; stroke: #15803d; stroke-width: 2.5; rx: 10; }
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #17351f; }
      .sub { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 15px; fill: #42614a; }
      .line { stroke: #166534; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #6aa879; stroke-width: 2.5; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 6; }
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 30px; font-weight: 800; fill: #102b18; }
    </style>
  </defs>

  <rect class="bg" width="1160" height="680"/>
  <text class="title" x="48" y="58">High-Performance URL Shortener Architecture</text>

  <rect class="box" x="70" y="115" width="210" height="105"/>
  <text class="label" x="105" y="160">Client / Frontend</text>
  <text class="sub" x="105" y="188">create, redirect, test UI</text>

  <rect class="core" x="425" y="110" width="280" height="120"/>
  <text class="label" x="478" y="158">Spring Boot API</text>
  <text class="sub" x="470" y="187">controllers, services, filters</text>
  <text class="sub" x="470" y="210">request IDs and metrics</text>

  <rect class="box" x="830" y="80" width="245" height="105"/>
  <text class="label" x="900" y="125">Redis</text>
  <text class="sub" x="875" y="153">URL cache</text>
  <text class="sub" x="875" y="174">Lua token bucket</text>

  <rect class="box" x="830" y="250" width="245" height="115"/>
  <text class="label" x="878" y="295">PostgreSQL</text>
  <text class="sub" x="870" y="323">URL mappings</text>
  <text class="sub" x="870" y="344">partitioned analytics</text>

  <rect class="box" x="430" y="310" width="270" height="115"/>
  <text class="label" x="510" y="355">Redpanda</text>
  <text class="sub" x="485" y="383">durable analytics topic</text>

  <rect class="box" x="95" y="330" width="245" height="105"/>
  <text class="label" x="145" y="375">Analytics Worker</text>
  <text class="sub" x="140" y="403">batch consumer to DB</text>

  <rect class="box" x="280" y="520" width="250" height="100"/>
  <text class="label" x="335" y="562">Prometheus</text>
  <text class="sub" x="325" y="590">/actuator/prometheus</text>

  <rect class="box" x="665" y="520" width="230" height="100"/>
  <text class="label" x="735" y="562">Grafana</text>
  <text class="sub" x="705" y="590">runtime dashboard</text>

  <path class="line" d="M280 168 L425 168"/>
  <path class="line" d="M705 145 L830 128"/>
  <path class="line" d="M705 198 L830 285"/>
  <path class="soft" d="M565 230 L565 310"/>
  <path class="line" d="M430 365 L340 382"/>
  <path class="line" d="M340 405 L830 340"/>
  <path class="soft" d="M525 520 L665 570"/>
  <path class="line" d="M565 425 L470 520"/>

  <text class="sub" x="300" y="150">HTTP</text>
  <text class="sub" x="740" y="118">cache hit / lock / rate-limit</text>
  <text class="sub" x="735" y="260">cache miss read/write</text>
  <text class="sub" x="585" y="282">async events</text>
  <text class="sub" x="545" y="495">metrics scrape</text>
</svg>
