name: Oracle Always Free verification
on:
  push:
    branches: [main, deploy/oracle-always-free]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oracle-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Standard hosted Linux is free on this public repository. Never spend private-repo minutes.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Existing and production tests with real PostgreSQL, Redis and Redpanda
        run: |
          mvn -B -ntp verify org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as E
          reports = [E.parse(p).getroot() for p in pathlib.Path('target/surefire-reports').glob('TEST-*.xml')]
          if not reports or sum(int(r.get('skipped', 0)) for r in reports):
              raise SystemExit('Integration tests must execute, not skip')
          PY
      - name: Build the production image and exercise the full stack
        run: |
          mkdir -p deploy/oracle/reports
          docker build -f deploy/oracle/Dockerfile -t shortener:ci .
          python3 deploy/oracle/validate-local.py --image shortener:ci
      - name: Browser acceptance and DOM injection regression
        working-directory: deploy/oracle/ui-test
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npm test
      - name: Actual backup, restore, update and failed-release rollback scripts
        run: python3 deploy/oracle/exercise-ops.py
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Build ARM64 and verify its JVM
        run: |
          docker buildx build --platform linux/arm64 --load -f deploy/oracle/Dockerfile -t shortener:ci-arm .
          test "$(docker image inspect -f '{{.Architecture}}' shortener:ci-arm)" = arm64
          docker run --rm --platform linux/arm64 --entrypoint java shortener:ci-arm -version
      - name: Gate known high and critical application/image vulnerabilities
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --no-progress --pkg-types os --scanners vuln --severity HIGH,CRITICAL --exit-code 1 shortener:ci-arm
          docker run --rm -v "$PWD/target:/scan:ro" -v "$PWD/deploy/oracle/.trivyignore.yaml:/policy.yaml:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            sbom --no-progress --severity HIGH,CRITICAL --ignorefile /policy.yaml --exit-code 1 /scan/bom.json
          python3 - <<'PY'
          import json
          bom=json.load(open('target/bom.json'))
          packages={x.get('purl','') for x in bom.get('components',[])}
          if not any('spring-webmvc' in p for p in packages) or not any('postgresql' in p for p in packages):
              raise SystemExit('Expected Java packages were not included in the scanned SBOM')
          print('Resolved Java packages scanned:',len(packages))
          PY
      - name: Preserve test results in the job log, without paid artifact storage
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as E
          reports = [E.parse(p).getroot() for p in pathlib.Path('target/surefire-reports').glob('TEST-*.xml')]
          print({k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')})
          PY
      - name: Stop only acceptance containers; preserve volumes
        if: always()
        run: |
          if test -f deploy/oracle/reports/local-stack.json; then python3 deploy/oracle/validate-local.py --stop; fi
